<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html
        PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets">
<h:body>
    <h2>Departments with My Batis:</h2>
    <ol>
        <ui:repeat value="#{departmentMyBatis.loadAllDepartments()}" var="dep">
            <li>#{dep.name}</li>
        </ui:repeat>
    </ol>
    <h:form>
        <div>
            <h:outputLabel value="Department name: " for="departmentNameInput"/>
            <h:inputText id="departmentNameInput" value="#{departmentMyBatis.department.name}" required="true"/>
        </div>
        <h:commandButton value="Add new department" action='#{departmentMyBatis.addDepartment()}' />
    </h:form>
    <h:link value="Back to index" outcome="/index"/>
    <br/>
    <h:link value="To My batis employees" outcome="/mybatis/employees"/>
</h:body>
</html>
