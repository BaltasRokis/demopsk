<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <style type="">
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }

        .section {
            border: 1px solid #ccc;
            padding: 1rem;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .form-field {
            margin-bottom: 1rem;
        }

        .form-field label {
            display: block;
            margin-bottom: 0.3rem;
        }
    </style>
</h:head>

<h:body>
    <div class="container">

        <div class="section">
            <h2>Departments</h2>
            <h4>Current departments:</h4>
            <ol>
                <ui:repeat value="#{departmentBean.departments}" var="dep">
                    <li><h:link value="#{dep.name}" outcome="departmentDetails?depId=#{dep.id}" /></li>
                </ui:repeat>
            </ol>

            <h4>Create new department:</h4>
            <h:form>
                <div class="form-field">
                    <h:outputLabel value="Name:" for="nameInput" />
                    <h:inputText id="nameInput" value="#{departmentBean.department.name}" required="true" />
                </div>
                <h:commandButton value="Add new department"
                                 actionListener="#{departmentBean.create()}"
                                 action="index?faces-redirect=true"/>
            </h:form>
        </div>


        <div class="section">
            <h2>Projects</h2>
            <h4>Current projects:</h4>
            <ol>
                <ui:repeat value="#{projectBean.projects}" var="project">
                    <li><h:link value="#{project.title}" outcome="projectDetails?projectId=#{project.id}" /></li>
                </ui:repeat>
            </ol>

            <h4>Create new project:</h4>
            <h:form>
                <div class="form-field">
                    <h:outputLabel value="Title:" for="titleInput" />
                    <h:inputText id="titleInput" value="#{projectBean.project.title}" required="true" />
                </div>

                <div class="form-field">
                    <h:outputLabel value="Description:" for="descriptionInput" />
                    <h:inputText id="descriptionInput" value="#{projectBean.project.description}" required="true" />
                </div>

                <div class="form-field">
                    <h:outputLabel value="Employees:" for="employeeCheckboxes" />
                    <h:selectManyCheckbox id="employeeCheckboxes" value="#{projectBean.project.employees}" layout="pageDirection">
                        <f:selectItems value="#{employeeBean.getEmployees()}" var="emp"
                                       itemValue="#{emp}" itemLabel="#{emp.firstName} #{emp.lastName} - #{emp.department.name}" />
                    </h:selectManyCheckbox>
                </div>

                <h:commandButton value="Add new project"
                                 actionListener="#{projectBean.create()}"
                                 action="index?faces-redirect=true"/>
            </h:form>
        </div>


        <div class="section">
            <h:link outcome="mybatis/departments" value="Go to MyBatis"/>
        </div>
    </div>
</h:body>
</html>
